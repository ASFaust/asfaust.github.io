<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jam Tricks</title>
  <link rel="stylesheet" href="../../fonts/fonts.css">
  <style>
    :root { color-scheme: light dark; }
    body { max-width: 640px; margin: 3rem auto; padding: 0 1.5rem; font: 16px/1.6 'Source Sans 3', sans-serif; }
    a { color: inherit; }
    button { font: inherit; cursor: pointer; }
    #retry { margin-right: 1rem; }
  </style>
</head>
<body>
  <p><a href="../../index.html">← Home</a></p>
  <h1>Jam Tricks</h1>
  <p id="status" role="status">Loading the patcher…</p>
  <p id="recovery" hidden>
    <button id="retry" type="button">Try again</button>
    <a href="https://github.com/ASFaust/sp404mk2-jam-tricks">Open the project on GitHub</a>
  </p>
  <noscript><p>Enable JavaScript to load and use the patcher.</p></noscript>
  <script>
    // The public repository owns the complete page, code and patch manifest.
    const source = 'https://raw.githubusercontent.com/ASFaust/sp404mk2-jam-tricks/refs/heads/main/web/standalone.html';
    document.getElementById('retry').addEventListener('click', () => location.reload());
    (async () => {
      try {
        const response = await fetch(source, {
          cache: 'no-cache', credentials: 'omit', signal: AbortSignal.timeout(20000)
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const html = await response.text();
        if (!html.includes('data-jam-tricks-standalone="1"')) throw new Error('Unexpected page');
        // Raw GitHub serves text/plain. Render the fetched, self-contained page here;
        // its inline scripts/styles avoid raw-host module and stylesheet MIME restrictions.
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById('status').textContent =
          'The patcher could not be loaded from GitHub. Please try again.';
        document.getElementById('recovery').hidden = false;
      }
    })();
  </script>
</body>
</html>
